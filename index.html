<!DOCTYPE htML>
<htML lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drink Water</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Drink Whisky Honey "Jack Daniel's"</h1>
        <div class="goal">Goal: 2 liters</div>
        <div class="big-bottle" id="bigBottle">
            <img src="/public/img/[CITYPNG.COM]HD Jack Daniel's Logo PNG - 3000x3000.png">
            <div class="remaining" id="remaining">2L Remained</div>
            <div class="water-level" id="waterLevel">
                <div class="percentage" id="percentage"><strong>0%</div>
            </div>
        </div>
        <p>Select the number of glasses of whisky that you have drunk:</p>
        <div class="bottle-buttons">
            <div class="bottle" data-volume="250">250 <br> ML</div>
            <div class="bottle" data-volume="250">250 <br> ML</div>
            <div class="bottle" data-volume="250">250 <br> ML</div>
            <div class="bottle" data-volume="250">250 <br> ML</div>
        </div>
        <br>
        <div class="bottle-buttonsv2">
        <div class="bottle" data-volume="250">250 <br> ML</div>
        <div class="bottle" data-volume="250">250 <br> ML</div>
        <div class="bottle" data-volume="250">250 <br> ML</div>
        <div class="bottle" data-volume="250">250 <br> ML</div>
    </div>
    <p>This is not sponso, unfortunately </p>
    <script src="/public/js/main.js"></script>
</body>
</htML>
